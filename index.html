<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07080b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Echolocation: drop short voice Echoes where you stand. Find them by walking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Echolocation">
  <title>Echolocation</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/record.css">
</head>
<body>
  <main class="screens">
    <!-- Record-and-drop screen: markup + logic live in js/record.js (self-contained, swappable). -->
    <section id="screen-record" class="screen" aria-label="Record" hidden></section>
    <!-- Listen screen: placeholder that hosts the hunt seam (js/listen.js -> js/hunt.js). -->
    <section id="screen-listen" class="screen" aria-label="Listen" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#record" data-tab="record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Drop</span>
    </a>
    <a href="#listen" data-tab="listen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8 8a5.6 5.6 0 0 0 0 8M16 8a5.6 5.6 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>
      <span>Listen</span>
    </a>
  </nav>

  <noscript><p class="noscript">Echolocation needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
