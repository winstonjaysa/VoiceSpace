<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Echolocation · debug map</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <!-- Hidden debug view (owner: Cooker). Not linked from the main UI. -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #07080b; color: #e9ecf2; font: 14px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif; }
    #map { position: absolute; inset: 0 0 38vh 0; }
    #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 38vh; overflow: auto; border-top: 1px solid #1c1f29; padding: 8px 12px; }
    #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    button { background: #0e1016; color: #e9ecf2; border: 1px solid #1c1f29; border-radius: 8px; padding: 6px 10px; font: inherit; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #1c1f29; white-space: nowrap; }
    tr.expired td { color: #7c8396; text-decoration: line-through; }
    .mapboxgl-popup-content { background: #0e1016; color: #e9ecf2; font-size: 12px; }
    .mapboxgl-popup-tip { border-top-color: #0e1016 !important; border-bottom-color: #0e1016 !important; }
    #status { color: #7c8396; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="bar">
      <strong>Echoes</strong> <span id="status"></span>
      <button id="locate">Show my position</button>
      <button id="reload">Reload</button>
      <label><input type="checkbox" id="showExpired" checked> expired</label>
    </div>
    <table><thead><tr><th>id</th><th>lat,lng</th><th>±m</th><th>hdg</th><th>created</th><th>expires</th><th>res</th><th>dur</th><th>src</th><th>audio</th></tr></thead>
      <tbody id="rows"></tbody></table>
  </div>
  <script type="module" src="js/debug.js"></script>
</body>
</html>
